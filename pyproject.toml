[project]
name = "comfyui-properpixelart"
version = "0.1.0"
description = "ComfyUI custom nodes wrapping proper-pixel-art."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Pome", email = "unclepome.dev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "proper-pixel-art>=1.7.2,<2.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "ruff>=0.16.10",
    "torch>=2.14.1,<3.0.0",
]

[tool.uv]
package = false
add-bounds = "major"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib --confcutdir=tests"

[tool.ruff.lint.per-file-ignores]
# hyphens.
"__init__.py" = ["N999"]
"comfyui_properpixelart/__init__.py" = ["N999"]
