[project]
name = "comfyui-properpixelart"
version = "0.0.3"
description = "Unofficial ComfyUI custom nodes wrapping proper-pixel-art \"Fixes AI pixel art images, video, or sprite web uploads\"."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Pome", email = "unclepome.dev@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "proper-pixel-art>=1.7.2,<2.0.0",
]

[project.urls]
Repository = "https://github.com/unclepomedev/ComfyUI-ProperPixelArt"
Documentation = "https://github.com/unclepomedev/ComfyUI-ProperPixelArt"
"Bug Tracker" = "https://github.com/unclepomedev/ComfyUI-ProperPixelArt/issues"

[tool.comfy]
PublisherId = "unclepomedev"
DisplayName = "comfyui-properpixelart"
requires-comfyui = ">=0.38.2"

[dependency-groups]
dev = [
    "pytest>=9.1.1,<10.0.0",
    "ruff>=0.16.10",
    "torch>=2.14.1,<3.0.0",
]

[tool.uv]
package = false
add-bounds = "major"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib --confcutdir=tests"

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "B", "SIM", "I", "T20", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# hyphens
"__init__.py" = ["N999"]
