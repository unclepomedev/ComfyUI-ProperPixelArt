name: Publish to Comfy registry

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check version consistency
        shell: bash
        run: |
          set -euo pipefail
          PROJECT_VERSION=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          TAG_VERSION=${GITHUB_REF_NAME#v}
          echo "pyproject: $PROJECT_VERSION, tag: $TAG_VERSION"
          if [ "$PROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Version mismatch! pyproject.toml ($PROJECT_VERSION) != tag ($TAG_VERSION)"
            exit 1
          fi

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: true

      - name: Publish Custom Node
        shell: bash
        env:
          COMFY_REGISTRY_TOKEN: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
        run: |
          uvx --from comfy-cli comfy --skip-prompt --no-enable-telemetry env
          uvx --from comfy-cli comfy node publish --token "$COMFY_REGISTRY_TOKEN"
