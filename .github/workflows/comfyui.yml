name: ComfyUI compatibility

on:
  workflow_call:
    inputs:
      os:
        description: "JSON array of runner operating systems"
        required: true
        type: string
      comfyui_ref:
        description: "ComfyUI ref (empty uses the pinned release)"
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  load-and-execute:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.os) }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout pack
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: Test loading and execution without a server
        shell: bash
        env:
          COMFYUI_REF: ${{ inputs.comfyui_ref }}
        run: uvx --from rust-just just comfyui-test ${COMFYUI_REF:+"$COMFYUI_REF"}
