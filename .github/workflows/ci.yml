name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --dev

      - name: Lint / Format
        run: |
          uv run ruff check
          uv run ruff format --check

      - name: Run tests
        run: uv run pytest
