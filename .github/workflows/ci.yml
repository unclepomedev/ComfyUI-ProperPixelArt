name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0

      - name: Install dev depencies
        run: uv sync --dev

      - name: List
        run: uv run ruff check .

      - name: Run tests
        run: uv run pytest
